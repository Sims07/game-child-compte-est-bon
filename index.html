<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le compte est bon !</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --chalkboard:#1F4B3F;
    --chalkboard-dark:#153A2F;
    --chalk:#F5F3E7;
    --wood:#C08552;
    --wood-dark:#8B5A2B;
    --coral:#E85B4D;
    --coral-dark:#C74536;
    --yellow:#F4C95D;
    --ink:#24312B;
    --paper:#FBF3E3;
    --die-green:#2F8F5B;
    --die-green-dark:#22713F;
  }
  body.theme-hp{
    --chalkboard:#740001;
    --chalkboard-dark:#4d0000;
    --chalk:#EFE1B3;
    --wood:#D3A625;
    --wood-dark:#946B00;
    --coral:#AE0001;
    --coral-dark:#740001;
    --yellow:#EEBA30;
    --ink:#2B1600;
    --paper:#F1E3C2;
    --die-green:#D3A625;
    --die-green-dark:#946B00;
    background-color:#E9D9A8;
    background-image:
      url("https://opengameart.org/sites/default/files/parchment_1.png"),
      radial-gradient(circle at 50% 45%, transparent 45%, rgba(70,45,10,0.35) 100%);
    background-repeat:no-repeat, no-repeat;
    background-size:cover, cover;
    background-position:center, center;
    background-attachment:fixed, fixed;
  }
  body.theme-hp h1{ font-family:'Cinzel Decorative', 'Patrick Hand', cursive; font-size:clamp(0.8rem, 5vw, 2.1rem); line-height:1.1; }
  body.theme-hp .target{ font-family:'Cinzel Decorative', 'Patrick Hand', cursive; font-size:clamp(1.8rem, 10vw, 3.6rem); }
  body.theme-hp #gameSubtitle{ font-size:clamp(0.68rem, 2.8vw, 0.95rem); }
  body.theme-hp #gameSubtitle, body.theme-hp .board .label, body.theme-hp footer{
    font-family:'EB Garamond', serif;
    font-style:italic;
    font-weight:500;
  }
  body.theme-hp .board{
    border-color:var(--wood);
    border-radius:6px;
    clip-path:polygon(0% 1.5%,9% 0%,18% 2%,27% 0.3%,36% 1.6%,45% 0%,54% 1.6%,63% 0.3%,72% 2%,81% 0%,90% 1.5%,100% 0.3%,100% 98.5%,91% 100%,82% 98%,73% 100%,64% 98.4%,55% 100%,46% 98%,37% 100%,28% 98.4%,19% 100%,10% 98%,0% 100%);
  }
  body.theme-hp .tray{
    background-image:
      url("https://opengameart.org/sites/default/files/parchment_1.png"),
      radial-gradient(circle at 15% 25%, rgba(139,90,0,0.14) 0, transparent 22%),
      radial-gradient(circle at 75% 20%, rgba(139,90,0,0.1) 0, transparent 18%),
      radial-gradient(circle at 60% 75%, rgba(139,90,0,0.13) 0, transparent 22%),
      radial-gradient(circle at 25% 85%, rgba(139,90,0,0.1) 0, transparent 16%);
    background-color:var(--wood);
    background-repeat:no-repeat;
    background-size:cover;
    background-position:center;
    background-blend-mode:overlay, normal, normal, normal, normal;
    border:2px solid #8a6100;
    border-radius:6px;
    clip-path:polygon(0% 2%,9% 0%,18% 2.5%,27% 0.5%,36% 2%,45% 0%,54% 2%,63% 0.5%,72% 2.5%,81% 0%,90% 2%,100% 0.5%,100% 98%,91% 100%,82% 97.5%,73% 100%,64% 98%,55% 100%,46% 97.5%,37% 100%,28% 98%,19% 100%,10% 97.5%,0% 100%);
  }
  body.theme-hp .tile{
    background-image:
      url("https://opengameart.org/sites/default/files/parchment_1.png"),
      radial-gradient(circle at 25% 20%, rgba(139,90,0,0.14) 0, transparent 40%),
      radial-gradient(circle at 75% 75%, rgba(139,90,0,0.16) 0, transparent 45%);
    background-color:#F1E3C2;
    background-repeat:no-repeat;
    background-size:cover;
    background-position:center;
    background-blend-mode:multiply, normal, normal;
    border-radius:11px 15px 12px 16px;
    box-shadow:0 4px 0 rgba(0,0,0,0.18), inset 0 0 0 1px rgba(148,107,0,0.35);
  }
  body.theme-hp .tile-wrap:nth-child(odd){ transform:rotate(-2deg); }
  body.theme-hp .tile-wrap:nth-child(even){ transform:rotate(2deg); }

  .theme-toggle-btn{
    display:flex;
    width:fit-content;
    align-items:center;
    justify-content:center;
    gap:4px;
    margin:6px auto 0;
    background:transparent;
    border:2px solid var(--chalkboard);
    color:var(--chalkboard);
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:clamp(0.75rem, 3vw, 0.85rem);
    padding:5px 14px;
    border-radius:999px;
    cursor:pointer;
  }
  body.theme-hp .theme-toggle-btn{ border-color:var(--wood); color:var(--wood-dark); }

  .hp-decor{ display:none; }
  body.theme-hp .hp-decor{ display:flex; }
  .hp-decor-top{
    justify-content:center;
    align-items:center;
    gap:clamp(10px, 3vw, 18px);
    margin-bottom:2px;
  }
  .hp-icon{ width:clamp(22px, 6vw, 36px); height:clamp(22px, 6vw, 36px); }
  .hp-hat{ transform:rotate(-6deg); }
  .hp-snitch{ animation:hp-flutter 2.4s ease-in-out infinite; }
  @keyframes hp-flutter{
    0%,100%{ transform:translateY(0) rotate(-4deg); }
    50%{ transform:translateY(-6px) rotate(4deg); }
  }

  .hp-bg-decor{ display:none; position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  body.theme-hp .hp-bg-decor{ display:block; }
  .hp-bg-decor .stars{
    position:absolute; inset:0;
    background-image:
      radial-gradient(2px 2px at 10% 20%, rgba(238,186,48,0.65) 0, transparent 60%),
      radial-gradient(1.5px 1.5px at 30% 55%, rgba(238,186,48,0.5) 0, transparent 60%),
      radial-gradient(2px 2px at 50% 12%, rgba(238,186,48,0.6) 0, transparent 60%),
      radial-gradient(1.5px 1.5px at 68% 78%, rgba(238,186,48,0.5) 0, transparent 60%),
      radial-gradient(2px 2px at 85% 25%, rgba(238,186,48,0.65) 0, transparent 60%),
      radial-gradient(1.5px 1.5px at 92% 60%, rgba(238,186,48,0.45) 0, transparent 60%),
      radial-gradient(1.5px 1.5px at 18% 82%, rgba(238,186,48,0.5) 0, transparent 60%),
      radial-gradient(2px 2px at 58% 40%, rgba(238,186,48,0.5) 0, transparent 60%);
    animation:hp-twinkle 3.6s ease-in-out infinite alternate;
  }
  @keyframes hp-twinkle{ 0%{ opacity:0.3; } 100%{ opacity:0.9; } }

  .hp-candle{ position:absolute; width:7px; height:30px; background:linear-gradient(#f6ecd2,#c9a227); border-radius:2px; opacity:0.85; }
  .hp-candle::before{
    content:"";
    position:absolute; top:-13px; left:50%;
    width:9px; height:15px;
    background:radial-gradient(circle, #ffd76a 0%, #ff9d1f 60%, transparent 75%);
    border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    transform:translateX(-50%);
    animation:hp-flicker 1.6s ease-in-out infinite;
  }
  @keyframes hp-flicker{
    0%,100%{ transform:translateX(-50%) scale(1); opacity:1; }
    50%{ transform:translateX(-50%) scale(0.85) rotate(4deg); opacity:0.8; }
  }
  .hp-candle-1{ top:6%; left:6%; }
  .hp-candle-2{ top:9%; left:90%; }
  .hp-candle-3{ top:70%; left:4%; }
  .hp-candle-4{ top:75%; left:93%; }

  .hp-celebrate{ display:none; position:relative; width:60px; height:90px; margin:8px auto 0; }
  .hp-celebrate.active{ display:block; }
  .hp-hourglass{ width:100%; height:100%; }
  .hp-hourglass-fill{ transform-box:fill-box; transform-origin:bottom; transform:scaleY(0); }
  .hp-celebrate.active .hp-hourglass-fill{ animation:hp-hourglass-fill 1s ease forwards; }
  @keyframes hp-hourglass-fill{ from{ transform:scaleY(0); } to{ transform:scaleY(1); } }
  .hp-sparks{ position:absolute; inset:0; }
  .hp-sparks span{
    position:absolute; top:50%; left:50%; width:6px; height:6px; border-radius:50%;
    background:var(--yellow); opacity:0;
    transform:translate(-50%,-50%) rotate(var(--a)) translateX(0);
  }
  .hp-celebrate.active .hp-sparks span{
    animation:hp-spark-burst 0.9s ease-out forwards;
    animation-delay:0.3s;
  }
  @keyframes hp-spark-burst{
    0%{ opacity:1; transform:translate(-50%,-50%) rotate(var(--a)) translateX(0) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-50%) rotate(var(--a)) translateX(42px) scale(0.3); }
  }
  *{box-sizing:border-box;}
  html{ overflow-x:hidden; }
  body{
    margin:0;
    min-height:100vh;
    background-color:var(--paper);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(192,133,82,0.10) 0, transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(47,143,91,0.10) 0, transparent 45%);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:14px 10px 20px;
    overflow-x:hidden;
  }
  .app{ width:100%; max-width:560px; position:relative; z-index:1; }
  header{ text-align:center; margin-bottom:10px; position:relative;}
  h1{
    font-family:'Patrick Hand', cursive;
    font-size:clamp(1.5rem, 7vw, 2.6rem);
    margin:0;
    color:var(--chalkboard);
    line-height:1.05;
  }
  header p{ margin:4px 0 0; font-weight:600; color:#5b6a5f; font-size:clamp(0.78rem, 3.2vw, 0.95rem);}
  .score{
    position:absolute; top:0; right:0;
    background:var(--yellow);
    border-radius:999px;
    padding:5px 12px;
    font-weight:700;
    font-size:clamp(0.8rem, 3vw, 0.95rem);
    box-shadow:0 3px 0 rgba(0,0,0,0.12);
  }

  .board{
    background:var(--chalkboard);
    border:8px solid var(--wood);
    border-radius:16px;
    padding:clamp(14px,4vw,22px) clamp(12px,4vw,20px) clamp(16px,4.5vw,26px);
    text-align:center;
    box-shadow:0 8px 0 var(--wood-dark), 0 14px 24px rgba(0,0,0,0.18);
    position:relative;
    overflow:hidden;
  }
  .board::before{
    content:"";
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size:6px 6px;
    pointer-events:none;
  }
  .board .label{
    font-family:'Patrick Hand', cursive;
    color:var(--chalk);
    font-size:clamp(0.85rem, 3.8vw, 1.15rem);
    opacity:0.85;
    letter-spacing:0.02em;
  }
  .target{
    font-family:'Patrick Hand', cursive;
    color:var(--chalk);
    font-size:clamp(2.6rem, 13vw, 5rem);
    line-height:1;
    margin:4px 0 2px;
    text-shadow:0 0 14px rgba(245,243,231,0.25);
    transition:transform 0.25s ease;
  }
  .target.pop{ transform:scale(1.15); }

  .feedback{
    min-height:1.4em;
    font-weight:700;
    font-size:clamp(0.85rem, 3.6vw, 1.05rem);
    margin-top:8px;
    color:var(--chalk);
  }

  .tray{
    background:var(--wood);
    border-radius:16px;
    padding:clamp(12px,3.5vw,18px) clamp(10px,3vw,16px);
    margin-top:12px;
    box-shadow:0 6px 0 var(--wood-dark);
  }
  .dice-row{
    display:flex;
    justify-content:center;
    gap:clamp(6px, 2.2vw, 14px);
    flex-wrap:wrap;
  }
  .die{
    width:clamp(44px, 13vw, 70px); height:clamp(44px, 13vw, 70px);
    background:var(--die-green);
    border:3px solid var(--die-green-dark);
    border-radius:12px;
    box-shadow:0 4px 0 var(--die-green-dark), 0 6px 10px rgba(0,0,0,0.18);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    padding:clamp(6px,1.8vw,10px);
  }
  .die .dot{ width:clamp(7px,2.2vw,12px); height:clamp(7px,2.2vw,12px); border-radius:50%; margin:auto; background:transparent; }
  .die .dot.on{ background:var(--chalk); box-shadow:0 1px 1px rgba(0,0,0,0.2) inset; }
  body.theme-hp .die{ background:#3A0000; border-color:var(--yellow); box-shadow:0 4px 0 #220000, 0 6px 10px rgba(0,0,0,0.25); }
  body.theme-hp .die .dot.on{ background:var(--yellow); box-shadow:none; }

  .tiles-row{
    display:flex;
    justify-content:center;
    gap:clamp(6px, 2vw, 10px);
    flex-wrap:wrap;
    margin-top:12px;
    min-height:56px;
  }
  .tile{
    width:clamp(44px, 13vw, 64px); height:clamp(44px, 13vw, 64px);
    background:var(--chalk);
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Patrick Hand', cursive;
    font-size:clamp(1.2rem, 5vw, 1.8rem);
    color:var(--ink);
    cursor:pointer;
    border:3px solid transparent;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
    transition:transform 0.15s ease, border-color 0.15s ease;
    user-select:none;
  }
  .tile:hover{ transform:translateY(-2px); }
  .tile.selected{ border-color:var(--coral); background:#fff; }
  .tile .history{
    position:absolute;
    margin-top:44px;
    font-size:0.6rem;
    font-family:'Quicksand',sans-serif;
    color:#7a6a58;
    font-weight:600;
  }
  .tile-wrap{ display:flex; flex-direction:column; align-items:center; position:relative;}

  .ops-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:clamp(8px, 2.5vw, 12px);
    margin-top:14px;
  }
  .op-btn{
    width:clamp(40px, 11vw, 52px); height:clamp(40px, 11vw, 52px);
    border-radius:50%;
    border:none;
    background:var(--chalkboard);
    color:var(--chalk);
    font-size:clamp(1.1rem, 4.5vw, 1.5rem);
    font-family:'Patrick Hand', cursive;
    cursor:pointer;
    box-shadow:0 4px 0 var(--chalkboard-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    line-height:1;
  }
  .op-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .op-btn:active:not(:disabled){ transform:translateY(3px); box-shadow:none; }
  .op-btn.active{ background:var(--coral); box-shadow:0 4px 0 var(--coral-dark); transform:translateY(2px); }
  #undoBtn{ background:var(--wood); box-shadow:0 4px 0 var(--wood-dark); font-size:clamp(0.95rem, 4vw, 1.2rem); }

  .actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:clamp(8px, 2.5vw, 12px);
    margin-top:16px;
    flex-wrap:wrap;
  }
  button.main-btn{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:clamp(0.85rem, 3.5vw, 1rem);
    padding:clamp(9px,2.6vw,12px) clamp(14px,4vw,22px);
    border-radius:999px;
    border:none;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,0.18);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    line-height:1.1;
  }
  button.main-btn:active{ transform:translateY(3px); box-shadow:none; }
  .btn-roll{ background:var(--coral); color:white; }
  .btn-validate{ background:var(--yellow); color:var(--ink); }
  .btn-hint{ background:transparent; color:var(--chalkboard); border:2px solid var(--chalkboard); box-shadow:none; padding:clamp(7px,2.2vw,10px) clamp(12px,3.5vw,20px);}
  .btn-hint:active{ transform:none; }
  .btn-next{ background:var(--chalkboard); color:var(--chalk); }
  button:disabled{ opacity:0.4; cursor:not-allowed; }

  .solution-box{
    margin-top:14px;
    background:#fff;
    border:2px dashed var(--wood);
    border-radius:12px;
    padding:10px 14px;
    font-weight:600;
    font-size:0.95rem;
    text-align:center;
    display:none;
  }
  .solution-box.show{ display:block; }

  footer{
    text-align:center;
    margin-top:14px;
    font-size:clamp(0.72rem, 3vw, 0.8rem);
    color:#8a8a80;
  }

  @media (max-width:480px){
    .hp-candle{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<div class="hp-bg-decor">
  <div class="stars"></div>
  <div class="hp-candle hp-candle-1"></div>
  <div class="hp-candle hp-candle-2"></div>
  <div class="hp-candle hp-candle-3"></div>
  <div class="hp-candle hp-candle-4"></div>
</div>
<div class="app">
  <header>
    <div class="hp-decor hp-decor-top">
      <svg class="hp-icon hp-hat" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 4 L48 44 L16 44 Z" fill="var(--chalkboard)" stroke="var(--wood)" stroke-width="2"/>
        <rect x="8" y="44" width="48" height="8" rx="4" fill="var(--chalkboard)" stroke="var(--wood)" stroke-width="2"/>
        <rect x="18" y="32" width="28" height="6" fill="var(--wood)"/>
        <path d="M32 10 L34 15 L39 16 L34 17 L32 22 L30 17 L25 16 L30 15 Z" fill="var(--yellow)"/>
      </svg>
    </div>
    <h1 id="gameTitle">Le compte est bon !</h1>
    <p id="gameSubtitle">Additions, soustractions et multiplications — niveau CE2</p>
    <div class="score"><span id="scoreIcon">⭐</span> <span id="score">0</span></div>
    <button class="theme-toggle-btn" id="themeToggle">🪄 Thème Poudlard</button>
  </header>

  <div class="board">
    <div class="label" id="targetLabel">Nombre à trouver</div>
    <div class="target" id="target">--</div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="hp-celebrate" id="hpCelebrate">
      <svg class="hp-hourglass" viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 4 H52 L30 45 L52 86 H8 L30 45 Z" fill="none" stroke="var(--wood)" stroke-width="3"/>
        <clipPath id="hgBottom"><path d="M12 84 L30 47 L48 84 Z"/></clipPath>
        <rect class="hp-hourglass-fill" x="8" y="44" width="44" height="40" fill="var(--coral)" clip-path="url(#hgBottom)"/>
      </svg>
      <div class="hp-sparks">
        <span style="--a:0deg"></span>
        <span style="--a:45deg"></span>
        <span style="--a:90deg"></span>
        <span style="--a:135deg"></span>
        <span style="--a:180deg"></span>
        <span style="--a:225deg"></span>
        <span style="--a:270deg"></span>
        <span style="--a:315deg"></span>
      </div>
    </div>
  </div>

  <div class="tray">
    <div class="dice-row" id="diceRow"></div>
    <div class="tiles-row" id="tilesRow"></div>
    <div class="ops-row">
      <button class="op-btn" id="opAdd" disabled>+</button>
      <button class="op-btn" id="opSub" disabled>−</button>
      <button class="op-btn" id="opMul" disabled>×</button>
      <button class="op-btn" id="undoBtn" title="Annuler la dernière opération" disabled>↩️</button>
    </div>
  </div>

  <div class="actions">
    <button class="main-btn btn-roll" id="rollBtn">🎲 Lancer les dés</button>
    <button class="main-btn btn-validate" id="validateBtn" disabled>Valider mon nombre</button>
    <button class="main-btn btn-hint" id="hintBtn" disabled>Voir une solution</button>
    <button class="main-btn btn-next" id="nextBtn" style="display:none;">Manche suivante ▶</button>
  </div>

  <div class="solution-box" id="solutionBox"></div>

  <footer id="footerText">Choisis un nombre, une opération (+ − ×), puis un second nombre pour calculer — comme sur une calculette — jusqu'à retrouver le nombre à trouver.</footer>
</div>

<script>
(function(){
  const dieRow = document.getElementById('diceRow');
  const tilesRow = document.getElementById('tilesRow');
  const targetEl = document.getElementById('target');
  const feedbackEl = document.getElementById('feedback');
  const scoreEl = document.getElementById('score');
  const rollBtn = document.getElementById('rollBtn');
  const validateBtn = document.getElementById('validateBtn');
  const hintBtn = document.getElementById('hintBtn');
  const nextBtn = document.getElementById('nextBtn');
  const solutionBox = document.getElementById('solutionBox');
  const opAdd = document.getElementById('opAdd');
  const opSub = document.getElementById('opSub');
  const opMul = document.getElementById('opMul');
  const undoBtn = document.getElementById('undoBtn');
  const themeToggle = document.getElementById('themeToggle');
  const gameTitle = document.getElementById('gameTitle');
  const gameSubtitle = document.getElementById('gameSubtitle');
  const targetLabel = document.getElementById('targetLabel');
  const scoreIcon = document.getElementById('scoreIcon');
  const footerText = document.getElementById('footerText');
  const hpCelebrate = document.getElementById('hpCelebrate');

  const DIE_PATTERNS = {
    1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8]
  };

  let pool = [];      // {id, value}
  let history = [];   // snapshots du pool avant chaque opération, pour l'annulation
  let primary = null; // id du premier nombre sélectionné
  let pendingOp = null; // '+', '-', '×' ou null
  let target = null;
  let solutionText = "";
  let score = 0;
  let uidCounter = 0;
  let roundLocked = true; // true until dice are rolled

  function uid(){ return 'n' + (uidCounter++); }

  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    }
    return audioCtx;
  }

  function playSuccessSound(){
    const ctx = getAudioCtx();
    if(!ctx) return;
    if(ctx.state === 'suspended'){ ctx.resume(); }
    const now = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5]; // do-mi-sol-do, petit arpège joyeux
    notes.forEach((freq, i) => {
      const start = now + i * 0.11;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.22, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.4);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.42);
    });
  }

  function renderDie(container, value){
    container.innerHTML = '';
    for(let i=0;i<9;i++){
      const d = document.createElement('div');
      d.className = 'dot' + (DIE_PATTERNS[value].includes(i) ? ' on' : '');
      container.appendChild(d);
    }
  }

  function rollDiceAnimation(finalValues, done){
    dieRow.innerHTML = '';
    const dieEls = finalValues.map(()=> {
      const die = document.createElement('div');
      die.className = 'die';
      dieRow.appendChild(die);
      return die;
    });
    let ticks = 0;
    const maxTicks = 10;
    const interval = setInterval(()=>{
      dieEls.forEach(el => renderDie(el, 1 + Math.floor(Math.random()*6)));
      ticks++;
      if(ticks >= maxTicks){
        clearInterval(interval);
        dieEls.forEach((el, i) => renderDie(el, finalValues[i]));
        done();
      }
    }, 60);
  }

  function randInt(min,max){ return min + Math.floor(Math.random()*(max-min+1)); }

  function attemptTarget(diceValues){
    for(let attempt=0; attempt<400; attempt++){
      const useThree = Math.random() < 0.4;
      const idx = [...diceValues.keys()];
      // shuffle
      for(let i=idx.length-1;i>0;i--){ const j=randInt(0,i); [idx[i],idx[j]]=[idx[j],idx[i]]; }
      const chosen = useThree ? idx.slice(0,3) : idx.slice(0,2);
      const vals = chosen.map(i=>diceValues[i]);

      const step = (a,b) => {
        const ops = ['+','+','-','×'];
        const op = ops[randInt(0,ops.length-1)];
        if(op==='×' && (a===1 || b===1)) return null;
        if(op==='-' && a===b) return null;
        let res, label;
        if(op==='+'){ res=a+b; label=`${a} + ${b} = ${res}`; }
        else if(op==='-'){ res=Math.abs(a-b); label=`${Math.max(a,b)} − ${Math.min(a,b)} = ${res}`; }
        else { res=a*b; label=`${a} × ${b} = ${res}`; }
        return {res, label};
      };

      let r1 = step(vals[0], vals[1]);
      if(!r1) continue;
      let finalRes = r1.res;
      let lines = [r1.label];

      if(useThree){
        let r2 = step(r1.res, vals[2]);
        if(!r2) continue;
        finalRes = r2.res;
        lines.push(r2.label);
      }

      if(finalRes >= 10 && finalRes <= 90){
        return { target: finalRes, solution: lines.join('\n') };
      }
    }
    return null; // aucun nombre valide (>=10) trouvé avec ces dés
  }

  function generateTarget(diceValues){
    return attemptTarget(diceValues);
  }

  function newRound(){
    feedbackEl.textContent = '';
    solutionBox.classList.remove('show');
    solutionBox.textContent = '';
    nextBtn.style.display = 'none';
    hpCelebrate.classList.remove('active');
    validateBtn.disabled = true;
    hintBtn.disabled = true;
    roundLocked = true;
    rollBtn.disabled = true;
    targetEl.textContent = '?';
    tilesRow.innerHTML = '';
    primary = null;
    pendingOp = null;
    pool = [];
    history = [];
    updateOpButtons();

    let diceValues = Array.from({length:5}, () => randInt(1,6));
    let gen = generateTarget(diceValues);
    let safety = 0;
    while(!gen && safety < 50){
      diceValues = Array.from({length:5}, () => randInt(1,6));
      gen = generateTarget(diceValues);
      safety++;
    }

    rollDiceAnimation(diceValues, () => {
      pool = diceValues.map(v => ({ id: uid(), value: v }));
      target = gen.target;
      solutionText = gen.solution;
      targetEl.textContent = target;
      targetEl.classList.add('pop');
      setTimeout(()=>targetEl.classList.remove('pop'), 250);
      roundLocked = false;
      rollBtn.disabled = false;
      hintBtn.disabled = false;
      renderTiles();
    });
  }

  function renderTiles(){
    tilesRow.innerHTML = '';
    pool.forEach(tile => {
      const wrap = document.createElement('div');
      wrap.className = 'tile-wrap';
      const el = document.createElement('div');
      el.className = 'tile' + (tile.id === primary ? ' selected' : '');
      el.textContent = tile.value;
      el.addEventListener('click', () => selectTile(tile.id));
      wrap.appendChild(el);
      if(tile.history){
        const h = document.createElement('div');
        h.className = 'history';
        h.textContent = tile.history;
        wrap.appendChild(h);
      }
      tilesRow.appendChild(wrap);
    });
    updateOpButtons();
  }

  function selectTile(id){
    if(roundLocked) return;
    if(primary === null){
      // premier nombre du calcul
      primary = id;
    } else if(id === primary && !pendingOp){
      // on reclique sur le même nombre sans opération choisie -> on désélectionne
      primary = null;
    } else if(pendingOp){
      if(id === primary){
        // reclique sur le nombre de départ pendant qu'une opération est en attente -> annule l'opération
        pendingOp = null;
      } else {
        // deuxième nombre choisi -> on calcule tout de suite, comme sur une calculette
        const success = doCombine(pendingOp, primary, id);
        if(success){ primary = null; pendingOp = null; }
      }
    } else {
      // aucune opération choisie -> on change simplement le nombre de départ
      primary = id;
    }
    renderTiles();
  }

  function chooseOp(op){
    if(roundLocked || primary === null) return;
    pendingOp = (pendingOp === op) ? null : op;
    renderTiles();
  }

  function updateOpButtons(){
    const canOperate = primary !== null;
    [opAdd, opSub, opMul].forEach(btn => btn.disabled = !canOperate);
    opAdd.classList.toggle('active', pendingOp === '+');
    opSub.classList.toggle('active', pendingOp === '-');
    opMul.classList.toggle('active', pendingOp === '×');
    validateBtn.disabled = !(primary !== null && !pendingOp);
    undoBtn.disabled = roundLocked || history.length === 0;
  }

  function doCombine(op, aId, bId){
    const a = pool.find(t => t.id === aId);
    const b = pool.find(t => t.id === bId);
    if(!a || !b) return false;
    let value, historyLabel;
    if(op === '+'){ value = a.value + b.value; historyLabel = `${a.value}+${b.value}`; }
    else if(op === '-'){
      value = Math.abs(a.value - b.value);
      if(value === 0){
        feedbackEl.textContent = "Ces deux nombres sont égaux, essaie une autre combinaison !";
        return false;
      }
      historyLabel = `${Math.max(a.value,b.value)}-${Math.min(a.value,b.value)}`;
    } else {
      value = a.value * b.value;
      historyLabel = `${a.value}×${b.value}`;
    }
    history.push(pool.map(t => ({...t})));
    pool = pool.filter(t => t.id !== a.id && t.id !== b.id);
    pool.push({ id: uid(), value, history: historyLabel });
    feedbackEl.textContent = '';
    return true;
  }

  function undo(){
    if(roundLocked || history.length === 0) return;
    pool = history.pop();
    primary = null;
    pendingOp = null;
    feedbackEl.textContent = '';
    renderTiles();
  }

  function validate(){
    if(!(primary !== null && !pendingOp)) return;
    const tile = pool.find(t => t.id === primary);
    if(!tile) return;
    const diff = Math.abs(tile.value - target);
    if(diff === 0){
      score++;
      scoreEl.textContent = score;
      feedbackEl.textContent = "🎉 Bravo, c'est exactement ça !";
      roundLocked = true;
      validateBtn.disabled = true;
      nextBtn.style.display = 'inline-block';
      playSuccessSound();
      if(currentTheme === 'hp'){
        hpCelebrate.classList.remove('active');
        void hpCelebrate.offsetWidth; // force le redémarrage de l'animation
        hpCelebrate.classList.add('active');
      }
    } else if(diff <= 3){
      feedbackEl.textContent = `👍 Presque ! Tu es à ${diff} près.`;
    } else {
      feedbackEl.textContent = "😕 Pas encore, essaie une autre combinaison.";
    }
  }

  function showHint(){
    solutionBox.textContent = "Une solution possible :\n" + solutionText;
    solutionBox.style.whiteSpace = 'pre-line';
    solutionBox.classList.add('show');
  }

  const THEMES = {
    classic: {
      title: 'Le compte est bon !',
      subtitle: 'Additions, soustractions et multiplications — niveau CE2',
      targetLabel: 'Nombre à trouver',
      scoreIcon: '⭐',
      toggleLabel: '🪄 Thème Poudlard',
      footer: "Choisis un nombre, une opération (+ − ×), puis un second nombre pour calculer — comme sur une calculette — jusqu'à retrouver le nombre à trouver."
    },
    hp: {
      title: 'Le compte est bon ⚡ édition Poudlard',
      subtitle: 'Un sortilège de calcul pour Gryffondor — niveau CE2',
      targetLabel: 'Nombre magique à trouver',
      scoreIcon: '🦁',
      toggleLabel: '📜 Thème classique',
      footer: "Choisis un nombre, un sortilège (+ − ×), puis un second nombre pour lancer ton calcul — jusqu'à trouver le nombre magique !"
    }
  };
  let currentTheme = 'classic';

  function applyTheme(name){
    currentTheme = name;
    document.body.classList.toggle('theme-hp', name === 'hp');
    const t = THEMES[name];
    gameTitle.textContent = t.title;
    gameSubtitle.textContent = t.subtitle;
    targetLabel.textContent = t.targetLabel;
    scoreIcon.textContent = t.scoreIcon;
    themeToggle.textContent = t.toggleLabel;
    footerText.textContent = t.footer;
  }

  themeToggle.addEventListener('click', () => {
    applyTheme(currentTheme === 'classic' ? 'hp' : 'classic');
  });

  opAdd.addEventListener('click', () => chooseOp('+'));
  opSub.addEventListener('click', () => chooseOp('-'));
  opMul.addEventListener('click', () => chooseOp('×'));
  undoBtn.addEventListener('click', undo);
  validateBtn.addEventListener('click', validate);
  hintBtn.addEventListener('click', showHint);
  rollBtn.addEventListener('click', newRound);
  nextBtn.addEventListener('click', newRound);

  newRound();
})();
</script>
</body>
